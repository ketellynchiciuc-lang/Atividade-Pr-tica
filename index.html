<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Amigo do Idoso - Prático e Fácil</title>
  <style>
    :root {
      --bg-body: #f0f4f8;
      --card-bg: #ffffff;
      --text-main: #1a1a1a;
      --primary: #0f52ba;
      --primary-hover: #0a3a85;
      --danger: #d9381e;
      --danger-hover: #a8230f;
      --success: #198754;
      --border-color: #0f52ba;
      --font-scale: 1;
    }

    body.high-contrast {
      --bg-body: #000000;
      --card-bg: #121212;
      --text-main: #ffffff;
      --primary: #ffff00;
      --primary-hover: #ffd700;
      --danger: #ff4d4d;
      --danger-hover: #ff0000;
      --success: #00ff66;
      --border-color: #ffff00;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-body);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      font-size: calc(20px * var(--font-scale));
      line-height: 1.5;
    }

    /* BARRA FIXA DE ACESSIBILIDADE */
    .acc-bar {
      position: sticky;
      top: 0;
      z-index: 1000;
      background-color: #111;
      padding: 12px;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .acc-btn {
      background-color: #333;
      color: #fff;
      border: 2px solid #fff;
      padding: 10px 16px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }

    body.high-contrast .acc-btn {
      background-color: #ffff00;
      color: #000;
      border-color: #fff;
    }

    header {
      background-color: var(--primary);
      color: white;
      text-align: center;
      padding: 30px 15px;
    }

    body.high-contrast header {
      color: #000;
      border-bottom: 4px solid #fff;
    }

    main {
      max-width: 800px;
      margin: 20px auto;
      padding: 0 15px;
    }

    .card {
      background-color: var(--card-bg);
      border: 4px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 30px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.1);
    }

    .card h2 {
      margin-top: 0;
      font-size: 1.5rem;
      border-bottom: 3px solid var(--border-color);
      padding-bottom: 10px;
    }

    /* BOTÕES GRANDES */
    .btn {
      background-color: var(--primary);
      color: #fff;
      border: none;
      padding: 16px 24px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      margin: 8px 0;
      display: inline-block;
      text-align: center;
      box-sizing: border-box;
      text-decoration: none;
    }

    body.high-contrast .btn {
      color: #000;
    }

    .btn-danger {
      background-color: var(--danger);
      font-size: 1.4rem;
    }

    .btn-success {
      background-color: var(--success);
    }

    /* CAMPOS DE ENTRADA */
    input, select {
      width: 100%;
      padding: 16px;
      margin: 10px 0 20px 0;
      font-size: 1.1rem;
      border: 3px solid #777;
      border-radius: 10px;
      box-sizing: border-box;
      background-color: var(--card-bg);
      color: var(--text-main);
    }

    /* LISTAS */
    ul {
      list-style: none;
      padding: 0;
    }

    li {
      background: rgba(0,0,0,0.05);
      border: 2px solid var(--border-color);
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    body.high-contrast li {
      background: #222;
    }

    .contact-btn {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .contact-btn a {
      flex: 1;
    }

    footer {
      text-align: center;
      padding: 20px;
      background-color: #111;
      color: #fff;
      margin-top: 40px;
    }
  </style>
</head>
<body>

  <div class="acc-bar">
    <button class="acc-btn" onclick="adjustFont(0.1)">A+ Aumentar</button>
    <button class="acc-btn" onclick="adjustFont(-0.1)">A- Diminuir</button>
    <button class="acc-btn" onclick="toggleContrast()">🌓 Alto Contraste</button>
    <button class="acc-btn" onclick="speakText('Modo de leitura ativado. Clique em qualquer texto para ouvir.')">🔊 Ouvir</button>
  </div>

  <header>
    <h1>Apoio Diário do Idoso</h1>
    <p>Ferramentas simples para facilitar o seu dia</p>
  </header>

  <main>

    <section class="card">
      <h2 onclick="speakText(this.innerText)">🚨 Ligação de Emergência</h2>
      <p onclick="speakText(this.innerText)">Aperte o botão abaixo se precisar de ajuda médica imediata:</p>
      <a href="tel:192" class="btn btn-danger" onclick="vibratePhone()">LIGAR PARA O SAMU (192)</a>
